<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Group Project</title>
</head>
<body>
    <header class="header">

        <div class="logo">

            <div class="logo-icon">
                <img src="images/logo.jpg">
            </div>

            <span class="logo-text">Soundwave</span>

        </div>
        
        <div class="search-container">

            <div class="search-box">

                <svg class="search-icon"
                     width="18"
                     height="18"
                     viewBox="0 0 24 24"
                     fill="none">

                    <circle
                        cx="11"
                        cy="11"
                        r="6.5"
                        stroke="currentColor"
                        stroke-width="2"
                    />

                    <path
                        d="M16 16L21 21"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                    />

                </svg>

                <input
                    id="searchInput"
                    type="text"
                    placeholder="Search songs or artists..."
                >

            </div>

            <button id="searchButton" class="search-button">
                Search
            </button>

        </div>

    </header>

    <main class="main">

        <div class="empty-state">

            <svg
                class="empty-search-icon"
                width="42"
                height="42"
                viewBox="0 0 24 24"
                fill="none">

                <circle
                    cx="10.8"
                    cy="10.8"
                    r="7"
                    stroke="currentColor"
                    stroke-width="1.8"
                />

                <path
                    d="M16 16L21 21"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                />

            </svg>

            <p>
                Search for a song or artist to get started
            </p>

        </div>

    </main>


<script src="script.js"></script>
</body>
</html>
